services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vende-mas-api:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app-internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`vende-mas.com.co`) && (PathPrefix(`/api`) || PathPrefix(`/storage/`) || Path(`/login`) || Path(`/forgot-password`) || Path(`/reset-password`) || Path(`/logout`) || Path(`/me`) || PathPrefix(`/me/`) || Path(`/auth/init`) || PathPrefix(`/2fa`))"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.priority=110"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.routers.api-legacy-admin.rule=Host(`vende-mas.com.co`) && HeaderRegexp(`Accept`, `.*application/json.*`) && (Path(`/admin/dashboard`) || Path(`/admin/plan-modules`) || PathPrefix(`/admin/platform`) || PathPrefix(`/admin/billing`) || PathPrefix(`/admin/telemetry`) || PathPrefix(`/admin/tenants`))"
      - "traefik.http.routers.api-legacy-admin.entrypoints=websecure"
      - "traefik.http.routers.api-legacy-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-legacy-admin.priority=200"
      - "traefik.http.routers.api-legacy-admin.middlewares=api-legacy-add-prefix"
      - "traefik.http.routers.api-legacy-admin.service=api"
      - "traefik.http.routers.api-legacy-admin-write.rule=Host(`vende-mas.com.co`) && Method(`POST`, `PUT`, `PATCH`, `DELETE`) && (PathPrefix(`/admin/platform`) || PathPrefix(`/admin/billing`) || PathPrefix(`/admin/telemetry`) || PathPrefix(`/admin/tenants`))"
      - "traefik.http.routers.api-legacy-admin-write.entrypoints=websecure"
      - "traefik.http.routers.api-legacy-admin-write.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-legacy-admin-write.priority=250"
      - "traefik.http.routers.api-legacy-admin-write.middlewares=api-legacy-add-prefix"
      - "traefik.http.routers.api-legacy-admin-write.service=api"
      - "traefik.http.routers.api-legacy-crm.rule=Host(`vende-mas.com.co`) && HeaderRegexp(`Accept`, `.*application/json.*`) && (PathPrefix(`/tenant/`) || PathPrefix(`/users`) || PathPrefix(`/accounts`) || PathPrefix(`/contacts`) || PathPrefix(`/relations`) || PathPrefix(`/crm-entities`) || PathPrefix(`/tags`) || PathPrefix(`/tasks`) || PathPrefix(`/interactions`) || PathPrefix(`/activities`) || PathPrefix(`/segments`) || PathPrefix(`/teams`))"
      - "traefik.http.routers.api-legacy-crm.entrypoints=websecure"
      - "traefik.http.routers.api-legacy-crm.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-legacy-crm.priority=200"
      - "traefik.http.routers.api-legacy-crm.middlewares=api-legacy-add-prefix"
      - "traefik.http.routers.api-legacy-crm.service=api"
      - "traefik.http.routers.api-legacy-sales.rule=Host(`vende-mas.com.co`) && HeaderRegexp(`Accept`, `.*application/json.*`) && (PathPrefix(`/opportunities`) || PathPrefix(`/quotations`) || PathPrefix(`/quotes`) || PathPrefix(`/finance`) || PathPrefix(`/invoices`) || PathPrefix(`/payments`) || PathPrefix(`/currency`) || PathPrefix(`/price-books`))"
      - "traefik.http.routers.api-legacy-sales.entrypoints=websecure"
      - "traefik.http.routers.api-legacy-sales.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-legacy-sales.priority=200"
      - "traefik.http.routers.api-legacy-sales.middlewares=api-legacy-add-prefix"
      - "traefik.http.routers.api-legacy-sales.service=api"
      - "traefik.http.routers.api-legacy-ops.rule=Host(`vende-mas.com.co`) && HeaderRegexp(`Accept`, `.*application/json.*`) && (PathPrefix(`/plans`) || PathPrefix(`/inventory`) || PathPrefix(`/products`) || PathPrefix(`/projects`) || PathPrefix(`/milestones`) || PathPrefix(`/documents`) || PathPrefix(`/document-types`) || PathPrefix(`/document-alerts`))"
      - "traefik.http.routers.api-legacy-ops.entrypoints=websecure"
      - "traefik.http.routers.api-legacy-ops.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-legacy-ops.priority=200"
      - "traefik.http.routers.api-legacy-ops.middlewares=api-legacy-add-prefix"
      - "traefik.http.routers.api-legacy-ops.service=api"
      - "traefik.http.routers.api-legacy-extra.rule=Host(`vende-mas.com.co`) && HeaderRegexp(`Accept`, `.*application/json.*`) && (PathPrefix(`/automation`) || PathPrefix(`/commissions`) || PathPrefix(`/partners`) || PathPrefix(`/partner-resources`) || PathPrefix(`/competitive-intelligence`) || PathPrefix(`/lost-reasons`) || PathPrefix(`/expenses`) || PathPrefix(`/purchases`) || PathPrefix(`/custom-fields`) || PathPrefix(`/dashboard`) || PathPrefix(`/schedule`) || PathPrefix(`/settings`) || PathPrefix(`/reports`) || PathPrefix(`/metrics`) || PathPrefix(`/logs`) || PathPrefix(`/rbac`) || PathPrefix(`/search`) || PathPrefix(`/support`))"
      - "traefik.http.routers.api-legacy-extra.entrypoints=websecure"
      - "traefik.http.routers.api-legacy-extra.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-legacy-extra.priority=200"
      - "traefik.http.routers.api-legacy-extra.middlewares=api-legacy-add-prefix"
      - "traefik.http.routers.api-legacy-extra.service=api"
      - "traefik.http.middlewares.api-legacy-add-prefix.addprefix.prefix=/api"

  queue:
    image: vende-mas-api:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app-internal

  scheduler:
    image: vende-mas-api:latest
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app-internal

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vende_mas}
      POSTGRES_USER: ${DB_USERNAME:-vende_mas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vende_mas} -d ${DB_DATABASE:-vende_mas}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-internal

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_DATABASE:-vende_mas}
      POSTGRES_USER: ${DB_USERNAME:-vende_mas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${POSTGRES_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${POSTGRES_BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - postgres_backups:/backups
    networks:
      - app-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ] && [ \"$${REDIS_PASSWORD}\" != \"null\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG; else redis-cli ping | grep PONG; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - app-internal

volumes:
  app_storage:
  postgres_data:
  postgres_backups:
  redis_data:

networks:
  app-internal:
    driver: bridge

  traefik-proxy:
    external: true
    name: traefik-proxy
