components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    UidPath:
      in: path
      name: uid
      required: true
      description: Identificador publico UUID del recurso.
      schema:
        type: string
        format: uuid
  responses:
    GenericSuccess:
      description: Operacion exitosa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Unauthorized:
      description: Token invalido o ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Error de validacion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    GenericRequest:
      type: object
      description: Payload generico. Revise las reglas del endpoint en el backend.
      example: {}
    ActivityRequest:
      type: object
      description: Payload para crear o actualizar una actividad. En rutas anidadas de oportunidad, el backend asigna `entity_type=opportunity` y `entity_uid` desde la URL.
      properties:
        type:
          type: string
          enum: [task, call, meeting, email, note, reminder]
          example: call
        title:
          type: string
          example: Llamada de seguimiento
        description:
          type: string
          example: Revisar propuesta enviada.
        status:
          type: string
          example: pending
        priority:
          type: string
          example: medium
        scheduled_at:
          type: string
          format: date-time
        assigned_user_uid:
          type: string
          format: uuid
    TaskRequest:
      type: object
      description: Payload para crear o actualizar tarea. En rutas anidadas de oportunidad, el backend asigna `taskable_type=opportunity` y `taskable_uid` desde la URL.
      properties:
        title:
          type: string
          example: Preparar propuesta
        description:
          type: string
          example: Adjuntar precios y condiciones.
        status:
          type: string
          example: pending
        priority:
          type: string
          example: medium
        due_date:
          type: string
          format: date
        assigned_user_uid:
          type: string
          format: uuid
    OpportunityLostReasonRequest:
      type: object
      description: Motivo capturado cuando una oportunidad se marca como perdida.
      properties:
        category:
          type: string
          example: price
        reason_type:
          type: string
          description: Alias historico de category.
          example: price
        competitor_uid:
          type: string
          format: uuid
        competitor:
          type: object
          description: Si no viene competitor_uid, puede enviarse este objeto para crear el competidor.
          properties:
            name:
              type: string
              example: Competidor X
            type:
              type: string
              example: direct
            description:
              type: string
        detail:
          type: string
          example: Perdimos por precio.
        details:
          type: string
          description: Alias de detail.
        notes:
          type: string
        summary:
          type: string
    AutomationRuleRequest:
      type: object
      required: [name, trigger_source, actions]
      properties:
        name:
          type: string
          example: Notificar oportunidad ganada
        description:
          type: string
        trigger_source:
          type: string
          description: Puede ser fuente (`crm`, `linkedin`, `facebook`, `time`) o evento directo como `deal_won`.
          example: crm
        trigger_event:
          type: string
          example: deal_won
        trigger_config:
          type: object
          additionalProperties: true
        conditions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              operator:
                type: string
                enum: [equals, not_equals, contains, not_contains, gt, gte, lt, lte, exists, not_exists]
              value: {}
        actions:
          type: array
          minItems: 1
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [send_email, update_field, create_task, send_webhook, create_lead, assign_owner, create_activity, apply_tag, send_notification]
              sequence:
                type: integer
              config:
                type: object
                additionalProperties: true
        logic:
          type: string
          enum: [AND, OR]
          example: AND
        is_active:
          type: boolean
    AutomationAssignmentRuleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Asignar leads enterprise
        description:
          type: string
        conditions:
          type: array
          items:
            type: object
            required: [field, operator]
            properties:
              field:
                type: string
              operator:
                type: string
                enum: [equals, not_equals, contains, not_contains, gt, gte, lt, lte, exists, not_exists]
              value: {}
        assigned_to_uid:
          type: string
          format: uuid
        user_ids:
          type: array
          description: Alternativa para asignacion rotativa o multiple.
          items:
            type: string
            format: uuid
        logic:
          type: string
          enum: [AND, OR]
        is_active:
          type: boolean
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@empresa.com
        password:
          type: string
          format: password
          example: '********'
        two_factor_code:
          type: string
          nullable: true
          example: '123456'
        recovery_code:
          type: string
          nullable: true
          example: ABCD-1234
    AuthUser:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        tenant_uid:
          type: string
          format: uuid
          nullable: true
        is_platform_admin:
          type: boolean
        avatar_url:
          type: string
          nullable: true
        two_factor_enabled:
          type: boolean
        locked_until:
          type: string
          format: date-time
          nullable: true
    AccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Acme SAS
        document:
          type: string
          example: "900123456"
        email:
          type: string
          format: email
          example: contacto@acme.com
        industry:
          type: string
          example: Manufactura
        website:
          type: string
          format: uri
          example: https://acme.com
        phone:
          type: string
          example: "+57 3000000000"
        address:
          type: string
          example: Bogota
    ContactRequest:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          example: Ana
        last_name:
          type: string
          example: Gomez
        email:
          type: string
          format: email
          example: ana@acme.com
        phone:
          type: string
          example: "+57 3001111111"
        position:
          type: string
          example: Gerente
        account_uid:
          type: string
          format: uuid
    UserRequest:
      type: object
      properties:
        name:
          type: string
          example: Ana Gomez
        email:
          type: string
          format: email
          example: ana@empresa.com
        password:
          type: string
          format: password
          example: '********'
        is_active:
